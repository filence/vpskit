name: Protected draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing version tag, for example v0.1.0
        required: true
        type: string

concurrency:
  group: protected-release
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.5"
  STATICCHECK_VERSION: "2026.1"
  SHELLCHECK_VERSION: "0.11.0"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  source-gate:
    name: Verify tagged source before secret access
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the exact tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0

      - name: Verify version tag
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_VERSION"
          test -f "docs/releases/$RELEASE_VERSION.md"

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify Go source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' go_files < <(find cmd internal -type f -name '*.go' -print0)
          test -z "$(gofmt -l "${go_files[@]}")"
          go mod verify
          go vet ./...
          go test ./...
          go install honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}
          staticcheck ./...

      - name: Verify shell scripts
        shell: bash
        run: |
          set -euo pipefail
          archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl --fail --location --proto '=https' --tlsv1.2 --output "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${archive}"
          printf '%s  %s\n' '8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198' "$archive" | sha256sum --check --strict
          tar -xf "$archive"
          mapfile -d '' shell_files < <(find scripts -type f \( -name '*.sh' -o -name '*.sh.in' \) -print0)
          "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" --severity=warning "${shell_files[@]}"

      - name: Scan tagged Git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks git --redact --no-banner --config .gitleaks.toml --log-opts='--all'

  draft-release:
    name: Build, attest, and upload a draft
    needs: source-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: production-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the exact tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build signed release assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          VPSKIT_RELEASE_PRIVATE_KEY: ${{ secrets.VPSKIT_RELEASE_PRIVATE_KEY }}
          VPSKIT_RELEASE_PUBLIC_KEY: ${{ secrets.VPSKIT_RELEASE_PUBLIC_KEY }}
          VPSKIT_RELEASE_NEXT_PUBLIC_KEY: ${{ secrets.VPSKIT_RELEASE_NEXT_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          scripts/build-release.sh "$RELEASE_VERSION" "$GITHUB_REPOSITORY" "$RUNNER_TEMP/vpskit-dist"

      - name: Generate build provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            ${{ runner.temp }}/vpskit-dist/*.tar.gz
            ${{ runner.temp }}/vpskit-dist/install.sh
            ${{ runner.temp }}/vpskit-dist/checksums.txt

      - name: Create GitHub draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_VERSION" "$RUNNER_TEMP"/vpskit-dist/* \
            --draft \
            --verify-tag \
            --notes-file "docs/releases/$RELEASE_VERSION.md" \
            --title "VPSKit $RELEASE_VERSION"
