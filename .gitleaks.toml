title = "VPSKit secret scanning policy"

[extend]
useDefault = true

[[allowlists]]
description = "Historical synthetic REALITY test fixture introduction; scope is one commit, one file, one field pattern"
condition = "AND"
commits = [
  '''5ee882d2d2560c6aa314c68e9bca27c7ce3b719a''',
]
paths = [
  '''^internal/render/render_test\.go$''',
]
regexTarget = "line"
regexes = [
  '''RealityPrivateKey:[[:space:]]+"[A-Za-z0-9_-]{43}"''',
]
